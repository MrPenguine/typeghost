name: Build Android APK from Python

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld
          pip install --upgrade pip
          pip install --upgrade buildozer "Cython<3.0" virtualenv

      - name: Build with Buildozer (Auto-Accept SDK License)
        working-directory: ./android_sender
        run: |
          for attempt in 1 2 3; do
            if yes | buildozer android debug; then
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed on attempt $attempt. Cleaning Android SDK temp cache and retrying..."
              rm -rf ~/.buildozer/android/platform/android-sdk/temp
              sleep 5
            else
              echo "Build failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeGhostRemote-APK
          path: android_sender/bin/*.apk
